[pytest]
# §6/§0 (audit 2026-10-17): 注册自定义 marker,并用 --strict-markers 让**拼错/未注册**
# 的 marker 直接报错,而不是被静默忽略(静默忽略会让"这组测试被排除"变成看不见的事)。
#
# 已知 marker:
#   slow —— 单条成本以**分钟**计、且依赖本地 DuckDB 的重型守卫(成交列表基线、
#           快速扫描器 vs 真引擎的对拍、产物产出型守卫、基准归因)。
#
# **默认仍然执行全部测试**(不加 -m 过滤):本仓库已有过多起"守卫悄悄失效"的事故,
# 而"默认跳过重型守卫"正是那种失效的一种形态 —— 它会在一片绿里把覆盖拿掉。
# 本 marker 只提供本地快速迭代的**显式**开关:
#
#     快速迭代(跳过重型守卫,约省 30 分钟):  pytest -m "not slow"
#     完整验证(默认,CI 应当用这个):          pytest
#     查看哪些最慢(以此决定还要标哪些):       pytest --durations=20
#
# 目前只标了 2026-10-16/17 新增的重型守卫;更早的历史测试尚未逐条标(需要一次
# --durations 跑分才能诚实地标),故 `-m "not slow"` 省下的时间会略少于理论上限。
markers =
    slow: 单条耗时以分钟计且依赖本地 DuckDB 的重型守卫(基线 / 对拍 / 产出型)。默认执行。

addopts = --strict-markers
